[workspace]
resolver = "2"
members = [
    "crates/zutreexo-accumulator",
    "crates/zutreexo-chain",
    "crates/zutreexo-bridge",
    "crates/zutreexo-csn",
    "crates/zutreexo-testkit",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/USCMigs/zutreexo"
authors = ["zutreexo contributors"]
publish = false

[workspace.dependencies]
# `version` alongside `path` is deliberate. A path-only dependency carries no
# version requirement, which is a wildcard (`*`), and `deny.toml` sets
# `wildcards = "deny"` — so omitting it fails the cargo-deny CI job even though
# these are internal crates that are never published. Keep these in step with
# `workspace.package.version` above.
zutreexo-accumulator = { path = "crates/zutreexo-accumulator", version = "0.0.0" }
zutreexo-chain = { path = "crates/zutreexo-chain", version = "0.0.0" }
zutreexo-csn = { path = "crates/zutreexo-csn", version = "0.0.0" }
zutreexo-bridge = { path = "crates/zutreexo-bridge", version = "0.0.0" }
zutreexo-testkit = { path = "crates/zutreexo-testkit", version = "0.0.0" }

blake2b_simd = "1.0"
rustreexo = "0.6"
thiserror = "2.0"

# Block and transaction deserialization for replay. CLAUDE.md §3: Zebra is the
# source of truth, and consensus-critical parsing is not vendored. 12.0.0 is the
# first published version carrying `src/ironwood.rs`, so it can parse the pool
# that activated at 3,428,143 — anything older silently cannot.
zebra-chain = "12.0"

criterion = "0.8"
hex = "0.4"
proptest = "1.11"

# Checkpoint files and repro dumps only. Already in the tree via zebra-chain,
# so this adds no new licence surface.
serde_json = "1.0"

# Lints applied to every crate in the workspace. See CLAUDE.md §5 rule 3: no
# unwrap/panic in accumulator or apply paths, because a panic in block
# application is a remote crash vector. `clippy.toml` exempts test code, where
# panicking is the point.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

# Integer overflow is a consensus bug, not a wrapping convenience. Zebra takes
# the same position. `clippy::arithmetic_side_effects` is deliberately *not*
# denied above: it fires on every `i + 1` and pushes the real checks into noise.
# Explicit `checked_*` guards the boundaries that can actually overflow (leaf
# counts, tree indices, deserialization lengths); this catches the rest.
[profile.release]
overflow-checks = true

[profile.bench]
debug = true
overflow-checks = true

# This pin now carries **three** upstream fixes, not one. Two of them are ours.
#
# **D10 — invalid proofs after deletion.** `rustreexo` 0.6.0 as published
# generates invalid inclusion proofs for any leaf whose sibling has been
# deleted, which breaks the transparent half of this project outright: a bridge
# node cannot serve proofs across blocks. The fork carries the one-line fix from
# upstream PR mit-dci/rustreexo#152, verified against a control — 1,848 of 4,671
# proofs fail on stock, 0 on the fork (D25).
#
# **D33 — `MemForest::deserialize` is not total on malformed input.** Two
# separate defects, both reachable from a snapshot file a peer supplied:
# an unrecognised node-type byte panics, and deeply nested input recurses until
# the stack overflows. The second is the worse one and was found while fixing
# the first: a stack overflow **aborts rather than unwinds**, so the
# `catch_unwind` in `UtxoForest::from_bytes` never contained it.
#
# Moving the pin from `dc368cc` to `8931ab8` is what lets `forest_decode` and
# `snapshot_decode` be fuzzed at all — both died within seconds before, and
# `scripts/fuzz_72h.sh` excluded them for that reason.
#
# A `[patch]` rather than a git dependency on the crate itself, so the version
# requirement above stays visible and **removing these three lines restores the
# published crate** the moment upstream merges. When that happens, delete this
# block, drop the `allow-git` entry in `deny.toml`, and expect
# `tests/upstream_rustreexo.rs` to keep passing — it asserts the fixed D10
# behaviour, so it is the guard on this pin. The D33 fixes are guarded by
# `fuzz/artifacts/{forest,snapshot}_decode/crash-*`, replayed as regression
# seeds.
[patch.crates-io]
rustreexo = { git = "https://github.com/USCMig/rustreexo", rev = "8931ab8b6a01c75bfb784d128b9c20df83217aee" }
