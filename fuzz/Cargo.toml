[package]
name = "zutreexo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# No `[patch]` any more: both this crate and the workspace take `rustreexo`
# from crates.io (0.7.0 carries every fix the fork did — docs/design.md D47).
#
# The hazard the old fork pin had survives in a smaller form. This crate is
# outside the workspace (see below), so it has **its own `Cargo.lock`**, and a
# `cargo update` in one directory but not the other leaves the fuzz targets
# exercising a different `rustreexo` from the one the workspace ships. That
# happened once with the fork rev: all five D33 crash artifacts reproduced
# against a `MemForest::deserialize` that had already been fixed, and the
# replay read as "the fix does not work". `tests/pins_agree.rs` in
# `zutreexo-testkit` now compares the two lockfiles' resolved version and
# source, and fails if they diverge.

# Deliberately outside the workspace. `cargo fuzz` builds with
# `-Zsanitizer=address` on nightly and its own profile; pulling it into the
# workspace would put those flags on every ordinary `cargo build` and would
# make `cargo deny` account for libfuzzer's tree as if it shipped.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
zutreexo-accumulator = { path = "../crates/zutreexo-accumulator" }
zutreexo-chain = { path = "../crates/zutreexo-chain" }
zutreexo-csn = { path = "../crates/zutreexo-csn" }
zutreexo-bridge = { path = "../crates/zutreexo-bridge" }

[profile.release]
debug = 1

[[bin]]
name = "bundle_decode"
path = "fuzz_targets/bundle_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "utxo_proof_decode"
path = "fuzz_targets/utxo_proof_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_decode"
path = "fuzz_targets/snapshot_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compact_state_decode"
path = "fuzz_targets/compact_state_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_request_decode"
path = "fuzz_targets/wire_request_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nonmembership_decode"
path = "fuzz_targets/nonmembership_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "forest_decode"
path = "fuzz_targets/forest_decode.rs"
test = false
doc = false
bench = false
